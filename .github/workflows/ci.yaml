name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  ECR_REPOSITORY: sports-store-gateway

jobs:
  validate:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Build validation image
        shell: bash
        run: |
          set -euo pipefail
          docker build --tag "${ECR_REPOSITORY}:ci-${GITHUB_SHA:0:7}" .

      - name: Validate NGINX configuration
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            --add-host auth-service:127.0.0.1 \
            --add-host catalog-service:127.0.0.1 \
            --add-host cart-service:127.0.0.1 \
            --add-host order-service:127.0.0.1 \
            --add-host payment-service:127.0.0.1 \
            --add-host frontend:127.0.0.1 \
            "${ECR_REPOSITORY}:ci-${GITHUB_SHA:0:7}" nginx -t

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Validate configuration and compute image tag
        id: metadata
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
          AWS_ECR_PUBLISH_ROLE_ARN: ${{ vars.AWS_ECR_PUBLISH_ROLE_ARN }}
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "${AWS_REGION}" ]] || { echo "::error::Required Actions variable AWS_REGION is empty."; exit 1; }
          [[ -n "${AWS_ECR_PUBLISH_ROLE_ARN}" ]] || { echo "::error::Required Actions variable AWS_ECR_PUBLISH_ROLE_ARN is empty."; exit 1; }
          mapfile -t version_lines < VERSION
          [[ ${#version_lines[@]} -eq 1 ]] || { echo "::error::VERSION must contain exactly one line."; exit 1; }
          version="$(printf '%s' "${version_lines[0]%$'\r'}" | sed 's/[[:space:]]*$//')"
          [[ "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::VERSION must use MAJOR.MINOR.PATCH."; exit 1; }
          short_sha="${GITHUB_SHA:0:7}"
          image_tag="${version}-${short_sha}"
          [[ "${image_tag}" =~ ^[0-9]+\.[0-9]+\.[0-9]+-[0-9a-f]{7}$ ]] || { echo "::error::Computed image tag is invalid."; exit 1; }
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "short_sha=${short_sha}" >> "${GITHUB_OUTPUT}"
          echo "image_tag=${image_tag}" >> "${GITHUB_OUTPUT}"

      - name: Configure AWS credentials through OIDC
        uses: aws-actions/configure-aws-credentials@v5
        with:
          aws-region: ${{ vars.AWS_REGION }}
          role-to-assume: ${{ vars.AWS_ECR_PUBLISH_ROLE_ARN }}
          role-session-name: sports-store-gateway-ci

      - name: Log in to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and publish immutable image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ steps.metadata.outputs.image_tag }}

      - name: Add publication summary
        env:
          IMAGE_TAG: ${{ steps.metadata.outputs.image_tag }}
        run: |
          {
            echo "### Published image"
            echo "- Repository: \`${ECR_REPOSITORY}\`"
            echo "- Immutable tag: \`${IMAGE_TAG}\`"
          } >> "${GITHUB_STEP_SUMMARY}"
