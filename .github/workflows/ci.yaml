name: Local Gateway CI

on:
  workflow_dispatch: {}
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: sports-store-gateway

jobs:
  validate-local-adapter:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Lint Dockerfile
        uses: hadolint/hadolint-action@v3.2.0
        with:
          dockerfile: Dockerfile
      - name: Build local-only image
        run: docker build --tag "${IMAGE_NAME}:ci-${GITHUB_SHA}" .
      - name: Validate NGINX configuration
        run: |
          docker run --rm \
            --add-host auth-service:127.0.0.1 \
            --add-host catalog-service:127.0.0.1 \
            --add-host cart-service:127.0.0.1 \
            --add-host order-service:127.0.0.1 \
            --add-host payment-service:127.0.0.1 \
            --add-host frontend:127.0.0.1 \
            "${IMAGE_NAME}:ci-${GITHUB_SHA}" nginx -t
      - name: Scan filesystem
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: 1
      - name: Scan local-only image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: "${{ env.IMAGE_NAME }}:ci-${{ github.sha }}"
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: 1
