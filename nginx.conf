log_format sports_store_json escape=json
    '{"timestamp":"$time_iso8601","level":"info","service":"gateway",'
    '"method":"$request_method","status":$status,'
    '"duration_seconds":$request_time,"event":"http_access"}';

access_log /dev/stdout sports_store_json;

server {
    listen 8080;
    server_name _;
    client_max_body_size 2m;

    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "healthy\n";
    }

    # Route paths below are fixed by the frontend's API contract and Architecture table
    location /api/auth/ {
        proxy_pass http://auth-service:8001;
        include /etc/nginx/proxy_params.conf;
    }

    location /api/products {
        proxy_pass http://catalog-service:8002;
        include /etc/nginx/proxy_params.conf;
    }

    # Internal endpoints exposed for course demos only
    location /api/internal/ {
        proxy_pass http://catalog-service:8002;
        include /etc/nginx/proxy_params.conf;
    }

    location /api/cart {
        proxy_pass http://cart-service:8003;
        include /etc/nginx/proxy_params.conf;
    }

    location /api/orders {
        proxy_pass http://order-service:8004;
        include /etc/nginx/proxy_params.conf;
    }

    location /api/payments {
        proxy_pass http://payment-service:8005;
        include /etc/nginx/proxy_params.conf;
    }

    location / {
        proxy_pass http://frontend:8080;
        include /etc/nginx/proxy_params.conf;
    }
}

# Only the exporter sidecar can reach this listener through Pod loopback.
server {
    listen 127.0.0.1:8081;
    server_name localhost;

    location = /stub_status {
        stub_status;
        access_log off;
        allow 127.0.0.1;
        deny all;
    }
}
